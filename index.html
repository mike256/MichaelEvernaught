<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Evernaught | International Man of Wonder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fauna+One&display=swap');

        /* Global Styles */
        body, html { 
            margin: 0; padding: 0; background-color: #0d0b09; 
            color: #d1c7b1; font-family: 'Fauna One', serif;
            scroll-behavior: smooth; overflow-x: hidden;
        }

        /* Hero Section */
        .hero-banner {
            position: relative;
            background: url('hero2.png') no-repeat center top;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
        }

        .hero-overlay {
            position: absolute; bottom: 0; width: 100%; height: 50%;
            background: linear-gradient(transparent, #0d0b09);
        }

        .hero-text { position: relative; z-index: 2; margin-bottom: 80px; padding: 0 20px; }

        /* Raised Brass Hero Text */
        h1 {
            font-family: 'Cinzel', serif; 
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            margin: 0; 
            letter-spacing: 6px;
            font-weight: 700;
            background: linear-gradient(
                to bottom, 
                #e5c687 0%,    
                #d4af37 45%,   
                #a67c00 55%,   
                #8a6d3b 100%   
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 1px 0px #f1d38e) 
                    drop-shadow(0px -1px 0px #5e4a1e) 
                    drop-shadow(2px 4px 6px rgba(0,0,0,0.9));
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.3rem); 
            font-style: italic;
            color: #bfa57d; 
            margin-top: 10px; 
            text-transform: uppercase; 
            letter-spacing: 8px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.1), 2px 2px 5px rgba(0,0,0,0.8);
        }

        /* ANTIQUE PHOTO GALLERY */
        .gallery-section { padding: 100px 10%; background: #0d0b09; text-align: center; }
        .gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 50px; margin-top: 50px;
        }

        .photo-frame {
            position: relative;
            background: #1e1a15; 
            padding: 25px; /* Frame thickness */
            
            /* Complex Antique Frame Border */
            border: 8px solid #0d0b09; /* Outer wood edge */
            outline: 2px solid #d4af37; /* Chiseled gold trim */
            outline-offset: -12px;
            
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.8), /* Floor shadow */
                inset 0 0 15px rgba(0,0,0,1); /* Inner frame depth */
            
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .photo-frame::before {
            /* Inner "Gold Bezel" effect */
            content: '';
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            pointer-events: none;
        }

        .photo-frame:hover { transform: scale(1.05) translateY(-10px); }

        .photo-frame img { 
            width: 100%; 
            height: auto; 
            display: block;
            filter: sepia(0.4) contrast(1.1) brightness(0.9);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5); /* Recess image into frame */
        }

        .caption { 
            font-family: 'Cinzel', serif; 
            color: #d4af37; 
            margin-top: 25px; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            font-size: 0.9rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Contact Section */
        .contact-wrap {
            padding: 120px 5%; 
            background: radial-gradient(circle, #1e1a15 0%, #0d0b09 100%);
            display: flex; justify-content: center;
        }

        .contact-card {
            width: 100%; 
            max-width: 700px; 
            background: #e0d5c1;
            padding: 80px 60px; 
            color: #120f0c; 
            border: 1px solid #bfa57d;
            border-radius: 40px; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            position: relative;
        }

        /* GLASS WAX SEAL BUTTON */
        .wax-seal {
            display: flex; align-items: center; justify-content: center;
            margin: 40px auto 0; width: 150px; height: 150px;
            background: radial-gradient(circle at 30% 30%, rgba(100, 0, 0, 0.6), rgba(40, 0, 0, 0.75));
            color: rgba(255, 255, 255, 0.85);
            border: 1.5px solid rgba(212, 175, 55, 0.25);
            border-radius: 50%;
            font-family: 'Cinzel', serif; font-weight: bold; font-size: 1rem;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: 
                0 6px 15px rgba(0,0,0,0.3), 
                inset 0 0 10px rgba(80, 0, 0, 0.3),
                inset 3px 3px 8px rgba(255, 255, 255, 0.1), 
                inset -3px -3px 10px rgba(0, 0, 0, 0.6);
            transition: all 0.5s ease;
        }

        .wax-seal:hover {
            transform: scale(1.03);
            background: radial-gradient(circle at 30% 30%, rgba(139, 0, 0, 0.7), rgba(60, 0, 0, 0.85));
            box-shadow: 0 8px 20px rgba(139, 0, 0, 0.3);
        }

        footer { text-align: center; padding: 60px 40px; font-size: 0.8rem; opacity: 0.4; letter-spacing: 2px; }
    </style>
</head>
<body>

    <!-- HERO -->
    <section class="hero-banner">
        <div class="hero-overlay"></div>
        <div class="hero-text">
            <h1>Michael Evernaught</h1>
            <div class="subtitle">International Man of Wonder</div>
            <a href="#contact" style="text-decoration:none;">
                <button class="wax-seal" style="width:auto; height:auto; padding:22px 60px; border-radius:60px;">Request an Audience</button>
            </a>
        </div>
    </section>

    <!-- GALLERY -->
    <section class="gallery-section">
        <h2 style="font-family:'Cinzel'; color:#d4af37; font-size: 2.2rem; margin-bottom: 20px;">Moments of Illumination</h2>
        <div class="gallery-grid">
            <div class="photo-frame">
                <img src="poster1.png" alt="Illusion I">
                <div class="caption">The Grand Illusion</div>
            </div>
            <div class="photo-frame">
                <img src="poster2.png" alt="Illusion II">
                <div class="caption">Echoes of Mystery</div>
            </div>
            <div class="photo-frame">
                <img src="poster3.png" alt="Illusion III">
                <div class="caption">The Final Vanishing</div>
            </div>
        </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="contact-wrap">
        <div class="contact-card">
            <h2 style="text-align:center; font-family:'Cinzel'; font-size: 2.2rem;">Functionality pending</h2>
            <p style="text-align:center; font-style:italic; opacity:0.7; margin-bottom:40px;">For international bookings and matters of mystery.</p>
            <form id="audience-form">
                <input type="text" id="name" placeholder="Name or Alias" required style="width:100%; padding:15px 0; background:transparent; border:none; border-bottom:1px solid rgba(0,0,0,0.2); font-family:inherit; outline:none; margin-bottom:30px;">
                <input type="email" id="email" placeholder="Contact Email" required style="width:100%; padding:15px 0; background:transparent; border:none; border-bottom:1px solid rgba(0,0,0,0.2); font-family:inherit; outline:none; margin-bottom:30px;">
                <textarea id="message" rows="4" placeholder="Your Correspondence" required style="width:100%; padding:15px 0; background:transparent; border:none; border-bottom:1px solid rgba(0,0,0,0.2); font-family:inherit; outline:none; margin-bottom:30px; resize:none;"></textarea>
                <button type="submit" class="wax-seal" disabled>Dispatch</button>
            </form>
        </div>
    </section>

    <div id="successModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; align-items:center; justify-content:center; backdrop-filter:blur(10px);">
        <div style="background:#e0d5c1; padding:50px; border:2px solid #d4af37; border-radius:30px; text-align:center; color:#120f0c; max-width:450px;">
            <h2 style="font-family:'Cinzel'; color:#600000;">Correspondence Received</h2>
            <p id="successMessage"></p>
            <button onclick="document.getElementById('successModal').style.display='none'" style="margin-top:25px; background:transparent; border:1px solid #120f0c; padding:10px 20px; font-family:'Cinzel'; cursor:pointer;">Return</button>
        </div>
    </div>

    <footer>&copy; 2026 Michael Evernaught | International Man of Wonder</footer>

    <script>
        document.getElementById('audience-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            document.getElementById('successMessage').innerText = `Your message has vanished into the ether, ${name}. Expect a manifestation soon.`;
            document.getElementById('successModal').style.display = 'flex';
            this.reset();
        });
    </script>
</body>
</html>
